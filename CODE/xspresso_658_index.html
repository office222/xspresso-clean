<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xspresso</title>
  <link rel="stylesheet" href="xspresso_659_app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-cup">☕</div>
        <div class="brand-text">
          <div class="brand-name">Xspresso</div>
          <div class="brand-tag">Done-for-you marketing</div>
        </div>
      </div>
      <nav class="top-actions">
        <button class="btn btn-secondary" data-route="dashboard">Dashboard</button>
        <button class="btn btn-primary" data-route="builder">Try the Demo</button>
      </nav>
    </header>

    <main class="content">
      <section class="hero card">
        <p class="eyebrow">Done-for-you marketing that gets responses</p>
        <h1>Wake up your marketing.</h1>
        <p class="subhead">Build campaigns faster, follow up automatically, and stay in command.</p>
        <div class="cta-row">
          <button class="btn btn-primary" data-route="builder">Create Campaign</button>
          <button class="btn btn-secondary" data-route="pricing">See Pricing</button>
        </div>
      </section>

      <section id="dashboard" class="grid-3"></section>
      <section id="builder" class="card"></section>
      <section id="monitoring" class="card"></section>
      <section id="pricing" class="card"></section>
      <section id="help" class="card"></section>
    </main>
  </div>

  <script src="xspresso_661_campaign_builder.js"></script>
  <script src="xspresso_662_monitoring_engine.js"></script>
  <script src="xspresso_660_app.js"></script>
</body>
</html>
